name: ci

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:
jobs:
    testar:
        runs-on: ubuntu-latest
        strategy: 
            matrix: 
                python-version: ["3.12", "3.13"]
        steps: 
            - name: checkout
              uses: actions/checkout@v4
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: ${{matrix.python-version}}
                cache: pip
            - name: install dependencies
              run: | 
                python -m pip install -r requirements-dev.txt
            - name: tests
              run: | 
                ruff check .
                pytest -v
    imagem:
      needs: testar
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: build_docker
          run: docker build -t calculadora:ci .
        - name: subir_container
          run: docker run -p 5000:5000 --name calc calculadora:ci
        - name: Esperar a API
          run: |
            for i in $(seq 1 15); do
              curl -fs http://localhost:5000/saude && exit 0
              sleep 2
            done
            exit 1
        - name: caso_de_falha
          if: failure()
          run: docker logs calc




                    
