name: ci

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:
jobs:
    testar:
        runs-on: ubuntu-latest
        steps: 
            - name: checkout
              uses: actions/checkout@v4
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: 3.12
                cache: pip
            - name: install dependencies
              run: | 
                python -m pip install -r requirements-dev.txt
            - name: tests
              run: | 
                ruff check .
                pytest -v



                    
