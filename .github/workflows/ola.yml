name: hello-world

on:
    workflow_dispatch:
        inputs:
            nome:
                description: "quem receberá bom dia?"
                default: "todo mundo"
jobs:
    saudacao:
        runs-on: ubuntu-latest
        steps: 
            - name: Saudação
              env:
                NOME: ${{ inputs.nome }}
              run: | 
                    echo "Olá, $NOME!"
                    echo "Evento: $GITHUB_EVENT_NAME"
                    echo "Runner: $RUNNER_OS"
            - name: Tem Docker
              run: docker --version


                    
